<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prüfungs-Uhr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Prüfungsdetails (oben) -->
    <div class="info-bar">
        <div class="info-bar-inner">

            <div class="info-group-row">
                <div class="info-group">
                    <p class="info-label">Anfang</p>
                    <p id="displayStart" class="info-value">--:--</p>
                </div>
                <div class="info-group">
                    <p class="info-label">Dauer</p>
                    <p id="displayDuration" class="info-value">-- <span class="unit-text">min</span></p>
                </div>
                <div class="info-group">
                    <p class="info-label">Verbleibende Zeit</p>
                    <p id="displayRemaining" class="info-value highlight">--:--</p>
                </div>
                <div class="info-group">
                    <p class="info-label">Geplantes Ende</p>
                    <p id="displayEnd" class="info-value">--:--</p>
                </div>
            </div>

            <!-- Dezente Steuerung -->
            <div id="controls">
                <input type="time" id="inputStart">
                <input type="number" id="inputDuration" min="1" placeholder="Dauer" value="60">
                <button onclick="saveSettings()" class="btn-ok">Übernehmen</button>
                <button onclick="resetAll()" class="btn-reset">Alles zurücksetzen</button>
            </div>

        </div>
    </div>

    <!-- Hauptfokus: Aktuelle Uhrzeit (mit Sekunden) -->
    <div class="clock-container">
        <p class="status-text">Aktuelle Zeit</p>
        <div id="currentTime" class="clock-display">00:00:00</div>
    </div>
</body>
</html>
